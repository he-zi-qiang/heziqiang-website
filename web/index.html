<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="何梓强（He Ziqiang）的个人网站——大连交通大学软件工程本科在读，关注 AI Agent 的执行框架、记忆与工具使用；这里是我的研究笔记与思考档案。" />
<title>何梓强 · He Ziqiang</title>
<!-- 霞鹜文楷（OFL 开源字体）：npmmirror 的 CDN 国内访问稳，字体按用到的字分块下载；
     用 media=print 再切回 all 的写法异步加载，样式表没到也不挡首屏，先用系统字体顶着 -->
<link rel="preconnect" href="https://registry.npmmirror.com" crossorigin />
<link rel="stylesheet" href="https://registry.npmmirror.com/lxgw-wenkai-webfont/1.7.0/files/lxgwwenkai-regular.css" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="https://registry.npmmirror.com/lxgw-wenkai-webfont/1.7.0/files/lxgwwenkai-bold.css" media="print" onload="this.media='all'" />
<noscript>
  <link rel="stylesheet" href="https://registry.npmmirror.com/lxgw-wenkai-webfont/1.7.0/files/lxgwwenkai-regular.css" />
  <link rel="stylesheet" href="https://registry.npmmirror.com/lxgw-wenkai-webfont/1.7.0/files/lxgwwenkai-bold.css" />
</noscript>
<link rel="icon" type="image/png" href="/avatar.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#FAF7F1" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)" />
<!-- 服务端写进 #app 的静态正文是给不跑 JS 的访问者（爬虫）看的；能跑 JS 就先藏起来，等 Vue 接手 -->
<style>.js .prerender { display: none; }</style>
<script>
  document.documentElement.classList.add('js');
  /* 兜底：脚本没能跑起来（网太差、浏览器太老）时，4 秒后把静态正文放出来，不让访客对着一张白纸 */
  setTimeout(function () {
    if (!window.__APP_MOUNTED__) document.documentElement.classList.remove('js');
  }, 4000);
  /* 首屏之前恢复深浅色与个性化配色，避免白底闪一下再变暗 */
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('hz-style-v2') || '{}');
      if (s.accent) document.documentElement.style.setProperty('--accent', s.accent);
      if (s.paper) document.documentElement.style.setProperty('--paper', s.paper);
    } catch (e) {}
    try {
      var t = localStorage.getItem('hz-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (t === 'dark' || (!t && prefersDark)) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
